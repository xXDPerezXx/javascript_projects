<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <audio id="bricklanding" src="brick_landing.ogg" preload="auto"></audio>
    <audio id="rotateSound" src="swoosh_turning_brick.mp3" preload="auto"></audio>
    <div class="container">
        <canvas id="game-board" class="canvas" width="300" height="600"></canvas>
        <div class="info">
            <p>Score: <span id="score">0</span></p>
            <p>Level: <span id="level">1</span></p>
            <p>Lines: <span id="lines">0</span></p>
            <p>Next:</p>
            <canvas id="next-piece" width="120" height="120"></canvas>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
